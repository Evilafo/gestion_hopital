{% extends 'layouts/base.html' %}
{% from 'macros.html' import csrf_field %}
{% block title %}Connexion{% endblock %}
{% block page_heading %}Connexion{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card p-4">
            <h2 class="h4 mb-3">Accès à votre espace</h2>
            <form method="POST">
                {{ csrf_field() }}
                <div class="mb-3">
                    <label class="form-label" for="username">Email</label>
                    <input type="email" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Se connecter</button>
            </form>
            <p class="text-center mt-3 mb-0"><a href="{{ url_for('register_patient') }}">Créer un compte patient</a></p>
        </div>
    </div>
</div>
{% endblock %}
