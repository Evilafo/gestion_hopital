{% extends 'layouts/base.html' %}
{% from 'macros.html' import csrf_field %}
{% block title %}{{ action }} personnel{% endblock %}
{% block page_heading %}{{ action }} un membre du personnel{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4">
            <form method="POST">
                {{ csrf_field() }}
                <div class="row">
                    <div class="col-md-6 mb-3"><label class="form-label">Prénom</label>
                        <input class="form-control" name="prenom" value="{{ user.prenom if user else '' }}" required></div>
                    <div class="col-md-6 mb-3"><label class="form-label">Nom</label>
                        <input class="form-control" name="nom" value="{{ user.nom if user else '' }}" required></div>
                </div>
                <div class="mb-3"><label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" value="{{ user.email if user else '' }}" required></div>
                <div class="mb-3"><label class="form-label">Téléphone</label>
                    <input class="form-control" name="contact" value="{{ user.contact if user else '' }}"></div>
                <div class="mb-3">
                    <label class="form-label">Rôle</label>
                    <select class="form-select" name="role" id="role" {% if user and user.role == 'admin' %}disabled{% endif %} onchange="toggleDoctorFields()">
                        <option value="medecin" {% if user and user.role == 'medecin' %}selected{% endif %}>Médecin</option>
                        <option value="secretaire" {% if user and user.role == 'secretaire' %}selected{% endif %}>Secrétaire</option>
                        {% if user and user.role == 'admin' %}<option value="admin" selected>Admin</option>{% endif %}
                    </select>
                </div>
                <div id="doctor-fields" style="display:none;">
                    <div class="mb-3"><label class="form-label">Spécialité</label>
                        <input class="form-control" id="specialite" name="specialite" value="{{ user.specialite if user else '' }}"></div>
                    <div class="mb-3"><label class="form-label">Salle</label>
                        <select class="form-select" name="salle_id">
                            <option value="">Aucune</option>
                            {% for salle in salles %}
                            <option value="{{ salle.id }}" {% if user and user.salle_id == salle.id %}selected{% endif %}>{{ salle.nom }} ({{ salle.numero }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="mb-3"><label class="form-label">Mot de passe</label>
                    <input type="password" class="form-control" name="password" {% if action == 'Ajouter' %}required{% endif %}></div>
                <button class="btn btn-success">{{ action }}</button>
            </form>
        </div>
    </div>
</div>
<script>
function toggleDoctorFields() {
    const show = document.getElementById('role').value === 'medecin';
    document.getElementById('doctor-fields').style.display = show ? 'block' : 'none';
}
document.addEventListener('DOMContentLoaded', toggleDoctorFields);
</script>
{% endblock %}
