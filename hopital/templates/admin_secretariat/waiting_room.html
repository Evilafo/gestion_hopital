<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salle d'attente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(180deg, #0d655e 0%, #0e4d48 100%);
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
        }
        .header {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 1.2rem;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .header h1 {
            color: white;
            font-weight: 700;
            margin: 0;
            font-size: 2rem;
        }
        .header p {
            color: rgba(255, 255, 255, 0.85);
            margin: 0.5rem 0 0 0;
            font-size: 1rem;
        }
        .section-title {
            color: white;
            font-weight: 600;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .section-title i {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.5rem;
            border-radius: 0.6rem;
        }
        .called-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 1.2rem;
            padding: 2.5rem;
            text-align: center;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideIn 0.5s ease-out;
        }
        .called-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }
        .called-card .display-5 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-shadow: none;
        }
        .called-card .lead {
            font-size: 1.25rem;
            margin: 0.5rem 0;
            text-shadow: none;
            color: rgba(255, 255, 255, 0.9);
        }
        .called-card p {
            color: rgba(255, 255, 255, 0.85);
            margin: 0.5rem 0;
        }
        .next-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .next-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }
        .next-card strong {
            color: white;
            font-size: 1.2rem;
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }
        .next-card .salle-info,
        .next-card .text-muted {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            margin: 0.4rem 0;
        }
        .empty-state {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 3rem;
            text-align: center;
            color: white;
            font-size: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .empty-state i {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 1rem;
        }
        .clock {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1.25rem 2rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .clock-time {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin: 0;
        }
        .clock small {
            color: rgba(255, 255, 255, 0.85);
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            }
            50% {
                transform: scale(1.02);
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            }
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <!-- Header -->
        <div class="header d-flex justify-content-between align-items-center">
            <div>
                <h1>Clinique Bodo</h1>
                <p class="text-muted mb-0 mt-2">Votre santé, notre priorité</p>
            </div>
            <div class="clock">
                <div class="clock-time" id="clock">00:00</div>
                <small class="text-muted">{{ date_du_jour.strftime('%d/%m/%Y') }}</small>
            </div>
        </div>

        <!-- Patients appelés -->
        <h2 class="section-title"><i class="bi bi-bell"></i> Patients appelés</h2>
        <div class="row g-4 mb-5" id="called"></div>

        <!-- Prochains patients -->
        <h2 class="section-title"><i class="bi bi-list-ol"></i> Prochains patients</h2>
        <div id="next" class="row g-3"></div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // Horloge en temps réel
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Polling de la file d'attente
        pollQueue(function (data) {
            const called = [];
            const next = [];
            
            data.medecins.forEach(function (m) {
                m.patients.forEach(function (p) {
                    if (p.statut === 'En Consultation') {
                        called.push({
                            nom: p.nom,
                            salle: m.salle,
                            medecin: m.nom,
                            specialite: m.specialite
                        });
                    } else if (p.statut === 'En Attente') {
                        next.push({
                            nom: p.nom,
                            salle: m.salle,
                            heure: p.heure,
                            medecin: m.nom
                        });
                    }
                });
            });

            // Affichage des patients appelés
            document.getElementById('called').innerHTML = called.length ? 
                called.map(function (c, index) {
                    return '<div class="col-md-6 col-lg-4"><div class="called-card ' + (index === 0 ? 'pulse-animation' : '') + '">' +
                        '<div class="display-5">' + c.nom + '</div>' +
                        '<p class="lead mt-3"><i class="bi bi-door-open"></i> Salle ' + c.salle + '</p>' +
                        '<p class="mb-0"><i class="bi bi-person-badge"></i> Dr. ' + c.medecin + '</p>' +
                        '</div></div>';
                }).join('') : 
                '<div class="col-12"><div class="empty-state">' +
                '<i class="bi bi-check-circle display-1 mb-3"></i><br>' +
                'Aucun patient appelé pour le moment</div></div>';

            // Affichage des prochains patients
            document.getElementById('next').innerHTML = next.length ? 
                next.slice(0, 8).map(function (n) {
                    return '<div class="col-md-4 col-lg-3"><div class="next-card">' +
                        '<strong>' + n.nom + '</strong>' +
                        '<div class="salle-info"><i class="bi bi-door-open"></i> Salle ' + n.salle + '</div>' +
                        '<div class="text-muted"><i class="bi bi-clock"></i> ' + n.heure + '</div>' +
                        '<div class="text-muted"><i class="bi bi-person"></i> Dr. ' + n.medecin + '</div>' +
                        '</div></div>';
                }).join('') : 
                '<div class="col-12"><div class="empty-state">' +
                '<i class="bi bi-people display-1 mb-3"></i><br>' +
                'File d\'attente vide</div></div>';
        }, 3000);
    </script>
</body>
</html>
