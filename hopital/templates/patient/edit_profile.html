{% extends 'layouts/base.html' %}
{% from 'macros.html' import csrf_field %}
{% block title %}Modifier mon profil{% endblock %}
{% block page_heading %}Mon dossier{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card p-4">
            <form method="POST">
                {{ csrf_field() }}
                <div class="mb-3">
                    <label class="form-label" for="nom">Nom</label>
                    <input class="form-control" id="nom" name="nom" value="{{ current_user.nom }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="prenom">Prénom</label>
                    <input class="form-control" id="prenom" name="prenom" value="{{ current_user.prenom }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="contact">Téléphone</label>
                    <input class="form-control" id="contact" name="contact" value="{{ current_user.contact or '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="date_naissance">Date de naissance</label>
                    <input type="date" class="form-control" id="date_naissance" name="date_naissance"
                           value="{{ current_user.date_naissance.strftime('%Y-%m-%d') if current_user.date_naissance else '' }}" required>
                </div>
                <p class="text-muted">Email : {{ current_user.email }}</p>
                <details class="mb-3">
                    <summary>Changer le mot de passe</summary>
                    <div class="mt-2">
                        <input type="password" class="form-control mb-2" name="password" placeholder="Nouveau mot de passe">
                        <input type="password" class="form-control" name="password_confirm" placeholder="Confirmation">
                    </div>
                </details>
                <button class="btn btn-success" type="submit">Enregistrer</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
