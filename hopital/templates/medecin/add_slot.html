{% extends 'layouts/base.html' %}
{% from 'macros.html' import csrf_field %}
{% block title %}Ajouter un créneau{% endblock %}
{% block page_heading %}Nouveau créneau{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card p-4">
            <form method="POST">
                {{ csrf_field() }}
                <div class="mb-3">
                    <label class="form-label" for="date">Date</label>
                    <input type="date" class="form-control" id="date" name="date" required min="{{ today.isoformat() }}">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="heure_debut">Début</label>
                        <input type="time" class="form-control" id="heure_debut" name="heure_debut" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="heure_fin">Fin</label>
                        <input type="time" class="form-control" id="heure_fin" name="heure_fin" required>
                    </div>
                </div>
                <button class="btn btn-success" type="submit">Ajouter</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
